[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-movoa"
version = "0.1.0"
description = "Unlimited AI video generator with sound: on paid plans the tenth take of a shot costs what the first did, and your first clip is free to make right now. LangChain tools for Movoa (movoa.ai): text to video and photo to video with sound from an agent."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Movoa (https://movoa.ai)" }]
keywords = ["langchain", "ai", "video-generation", "text-to-video", "image-to-video", "minimax-h3", "seedance-2-5", "veo-3", "tool", "agent", "movoa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = ["langchain-core>=0.3", "movoa>=0.1.0"]

[project.urls]
Homepage = "https://movoa.ai/?utm_source=pypi-langchain&utm_medium=package"
"Text to video" = "https://movoa.ai/video/text-to-video"
"API keys" = "https://movoa.ai/settings/apikeys"
Pricing = "https://movoa.ai/pricing"
Source = "https://github.com/hanshs474/langchain-movoa"

[tool.hatch.build.targets.wheel]
packages = ["langchain_movoa"]
